<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>hello</title>

        <style>
            body {
                margin: 0;
                background: #000;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                position: relative;
                font-family: "MS Sans Serif", "Tahoma", Arial, sans-serif;
            }

            video {
                position: absolute;
                top: 0;
                left: 0;
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            #no-signal-video {
                display: none;
            }

            #audio-gate {
                position: absolute;
                bottom: 10px;
                right: 10px;
                background: #d4d0c8;
                border: 2px solid;
                border-color: #fff #808080 #808080 #fff;
                padding: 6px 10px;
                font-size: 11px;
                cursor: pointer;
                box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.4);
                z-index: 5;
            }

            #audio-gate:active {
                border-color: #808080 #fff #fff #808080;
            }

            #audio-gate.hidden {
                display: none;
            }
        </style>
    </head>

    <body>
        <video
            id="verity-video"
            src="../videos/verity.mp4"
            autoplay
            loop
            muted
            playsinline
        ></video>

        <video
            id="no-signal-video"
            src="../videos/no-signal.mp4"
            preload="auto"
            loop
            muted
            playsinline
        ></video>

        <button id="audio-gate" type="button">
            click for audio
        </button>

        <script>
            window.helloAudioReady = false;

            const audioGate = document.getElementById("audio-gate");
            const verityVideo = document.getElementById("verity-video");
            const noSignalVideo = document.getElementById("no-signal-video");

            audioGate.addEventListener("click", function () {
                window.helloAudioReady = true;

                audioGate.classList.add("hidden");

                if (!noSignalVideo.paused) {
                    noSignalVideo.muted = false;
                }
            });

            window.showNoSignal = function () {
                verityVideo.pause();
                verityVideo.currentTime = 0;

                verityVideo.style.display = "none";

                noSignalVideo.style.display = "block";
                noSignalVideo.currentTime = 0;

                noSignalVideo.muted = !window.helloAudioReady;

                noSignalVideo.play().catch(function () {});
            };

            window.showVerity = function () {

                noSignalVideo.pause();
                noSignalVideo.currentTime = 0;
                noSignalVideo.muted = true;

                noSignalVideo.style.display = "none";

                verityVideo.style.display = "block";
                verityVideo.muted = true;
                verityVideo.currentTime = 0;

                verityVideo.play().catch(function () {});
            };


            window.stopVideos = function () {
                verityVideo.pause();
                noSignalVideo.pause();

                verityVideo.currentTime = 0;
                noSignalVideo.currentTime = 0;

                verityVideo.muted = true;
                noSignalVideo.muted = true;
            };


            window.resumeCurrentVideo = function (backroomsActive) {
                if (backroomsActive) {
                    window.showNoSignal();
                } else {
                    window.showVerity();
                }
            };
            // verity ??
        </script>
    </body>
</html>
