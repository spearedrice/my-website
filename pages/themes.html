<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>themes</title>
        <style>
            body {
                margin: 0;
                padding: 16px;
                background: #d4d0c8;
                font-family: "MS Sans Serif", "Tahoma", Arial, sans-serif;
                font-size: 13px;
                color: #222;
                box-sizing: border-box;
                overflow-y: auto;
            }

            h2 {
                margin: 0 0 12px;
                font-size: 14px;
                color: #2b5797;
            }

            h2.section-gap {
                margin-top: 18px;
            }

            .swatch-row {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }

            .swatch {
                width: 90px;
                cursor: pointer;
                border: 2px solid;
                border-color: #fff #808080 #808080 #fff;
                background: #fff;
                padding: 6px;
                text-align: center;
                font-size: 11px;
            }

            .swatch:active {
                border-color: #808080 #fff #fff #808080;
            }

            .swatch.active-swatch {
                outline: 2px solid #000080;
                outline-offset: 1px;
            }

            .swatch-preview {
                width: 100%;
                height: 40px;
                margin-bottom: 6px;
                border: 1px solid #808080;
                background-size: cover;
                background-position: center;
            }

            .preview-teal {
                background: linear-gradient(135deg, #008080, #1084d0);
            }

            .preview-dark {
                background: linear-gradient(135deg, #1a1a1a, #3a3a3a);
            }

            .preview-miku {
                background: linear-gradient(135deg, #bec8d1 0 20%, #86cecb 20% 40%, #137a7f 40% 60%, #373b3e 60% 80%, #e12885 80% 100%);
            }

            .preview-default {
                background: #008080;
            }
        </style>
    </head>

    <body>
        <h2>Theme</h2>

        <div class="swatch-row" id="theme-row">
            <div class="swatch" data-theme="">
                <div class="swatch-preview preview-teal"></div>
                Teal 95
            </div>

            <div class="swatch" data-theme="dark">
                <div class="swatch-preview preview-dark"></div>
                Dark Mode
            </div>

            <div class="swatch" data-theme="miku">
                <div class="swatch-preview preview-miku"></div>
                Miku
            </div>
        </div>

        <h2 class="section-gap">Wallpaper</h2>

        <div class="swatch-row" id="wallpaper-row"></div>

        <script>
            const parentWin = window.parent;

            const themeSwatches = document.querySelectorAll("#theme-row .swatch");
            const wallpaperRow = document.getElementById("wallpaper-row");

            function markActiveTheme(theme) {
                themeSwatches.forEach(function(el) {
                    el.classList.toggle("active-swatch", el.dataset.theme === theme);
                });
            }

            function markActiveWallpaper(id) {
                wallpaperRow.querySelectorAll(".swatch").forEach(function(el) {
                    el.classList.toggle("active-swatch", el.dataset.wallpaper === id);
                });
            }

            themeSwatches.forEach(function(el) {
                el.addEventListener("click", function() {
                    const theme = el.dataset.theme;

                    if (parentWin && typeof parentWin.setSiteTheme === "function") {
                        parentWin.setSiteTheme(theme);
                    }

                    markActiveTheme(theme);
                });
            });

            const wallpaperList = (parentWin && parentWin.WALLPAPERS) || [];
            const wallpaperOptions = [{ id: "", label: "Default", src: "" }].concat(wallpaperList);

            wallpaperOptions.forEach(function(wp) {
                const el = document.createElement("div");
                el.className = "swatch";
                el.dataset.wallpaper = wp.id;

                const preview = document.createElement("div");
                preview.className = "swatch-preview";

                if (wp.src) {
                    preview.style.backgroundImage = 'url("../' + wp.src + '")';
                } else {
                    preview.classList.add("preview-default");
                }

                el.appendChild(preview);
                el.appendChild(document.createTextNode(wp.label));

                el.addEventListener("click", function() {
                    if (parentWin && typeof parentWin.setSiteWallpaper === "function") {
                        parentWin.setSiteWallpaper(wp.id);
                    }

                    markActiveWallpaper(wp.id);
                });

                wallpaperRow.appendChild(el);
            });

            if (parentWin && typeof parentWin.getSiteTheme === "function") {
                markActiveTheme(parentWin.getSiteTheme());
            }

            if (parentWin && typeof parentWin.getSiteWallpaper === "function") {
                markActiveWallpaper(parentWin.getSiteWallpaper());
            }
        </script>
    </body>
</html>
