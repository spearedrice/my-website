<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>about</title>
        <style>
            body {
                margin: 0;
                padding: 18px;
                background: #d4d0c8;
                font-family: "MS Sans Serif", "Tahoma", Arial, sans-serif;
                box-sizing: border-box;
            }

            .profile-row {
                display: flex;
                align-items: center;
                gap: 14px;
                margin-bottom: 14px;
                padding-bottom: 14px;
                border-bottom: 1px solid #808080;
            }

            .profile-pic {
                width: 64px;
                height: 64px;
                object-fit: cover;
                border: 2px solid;
                border-color: #808080 #fff #fff #808080;
                image-rendering: pixelated;
            }

            .profile-stats {
                display: flex;
                flex-direction: column;
                gap: 3px;
                font-size: 12px;
                color: #333;
            }

            .profile-stats strong {
                color: #111;
            }

            h2 {
                margin: 0 0 10px;
                color: #2b5797;
                font-size: 20px;
            }

            p {
                margin: 8px 0;
                line-height: 1.5;
                color: #222;
                font-size: 14px;
            }

            body.backrooms-iframe {
                background: #cabb85;
                animation: br-iframe-flicker 4s infinite;
            }

            body.backrooms-iframe h2,
            body.backrooms-iframe p,
            body.backrooms-iframe strong,
            body.backrooms-iframe .profile-stats {
                color: #2a1f0d;
            }

            body.backrooms-iframe .profile-row {
                border-bottom-color: #6b5a1e;
            }

            body.backrooms-iframe .profile-pic {
                border-color: #f0e4b0 #6b5a1e #6b5a1e #f0e4b0;
                filter: sepia(0.6) contrast(1.3);
            }

            @keyframes br-iframe-flicker {
                0%, 96%, 100% { text-shadow: none; }
                97% { text-shadow: 1px 0 0 rgba(255, 0, 0, 0.35), -1px 0 0 rgba(0, 255, 255, 0.35); }
                98% { text-shadow: none; }
            }
        </style>
    </head>

    <body>
        <div class="profile-row">
            <img class="profile-pic" src="../images/profile.png" alt="" />

            <div class="profile-stats">
                <span><strong>Status:</strong> to be announced soon</span>

            </div>
        </div>

        <h2>About Me</h2>
        <p>
            Hey there!
        </p>
    </body>
</html>
