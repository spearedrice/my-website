<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rice's Site</title>
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <div id="desktop-icons"></div>

        <div id="main-panel">
            <div class="panel">
                <div class="intro">
                    <h1>Hello!</h1>
                    <p>Welcome to my site!</p>
                </div>
            </div>

            <div class="panel">
                <h2>About Me</h2>
                <p>
                    Hey! I'm Rice. This site is still a work in progress, but
                    I'll be adding more to it over time.
                </p>
            </div>
        </div>

        <div id="windows"></div>

        <div id="music-player">
            <div class="music-titlebar">
                <img class="music-icon" id="music-icon-img" src="" alt="" />
                <span id="music-title-label">now playing</span>
            </div>

            <div class="music-body">
                <iframe id="music-frame" src="pages/music.html" frameborder="0"></iframe>
            </div>
        </div>

        <div id="taskbar" class="taskbar"></div>

        <script src="script.js"></script>
    </body>
</html>
