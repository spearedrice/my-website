<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rice's Site</title>
        <link rel="icon" type="image/png" href="images/profile.png" />
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <div id="entry-overlay">
            <video id="entry-video" autoplay muted loop playsinline>
                <source src="videos/birb.webm" type="video/webm" />
            </video>

            <div class="entry-box">
                <div class="entry-titlebar">system</div>
                <div class="entry-body">
                    <p>click to enter</p>
                </div>
            </div>
        </div>

        <div id="system-info">
            <img src="images/watermark.png" alt="" />
            <span>RICE-PC<br />v1.1.8</span>
        </div>

        <div id="desktop-icons"></div>

        <div id="windows"></div>

        <div id="music-player">
            <div id="music-player-content"></div>
        </div>
        <div id="local-save-notice">
            <div class="notice-titlebar">
                <span class="notice-title">notification</span>
                <button id="notice-close" type="button">×</button>
            </div>

            <div class="notice-body">
                <p>
                    Your player settings (volume, shuffle, repeat) save only
                    to this device - nothing is sent anywhere.
                </p>
            </div>
        </div>

        <img
            id="backrooms-girl"
            src="images/backrooms-girl-1.png"
            alt=""
        />

        <img
            id="backrooms-still-life"
            src="images/backrooms-still-life-1.png"
            alt=""
        />

        <div id="taskbar" class="taskbar"></div>

        <div class="backrooms-scene"></div>

        <script src="https://cdn.jsdelivr.net/npm/mp3tag.js@latest/dist/mp3tag.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
