<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rice's Site</title>
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <div class="panel">
            <div class="intro">
                <h1>Hello!</h1>
                <p>Welcome to my site!</p>
            </div>
        </div>

        <div class="panel">
            <h2>About Me</h2>
            <p>
                Hey! I'm Rice. This site is still a work in progress, but I'll
                be adding more to it over time.
            </p>
        </div>

        <div class="panel">
            <h2>Unnamed Panel</h2>
            <p>click the button below.</p>
            <button onclick="openWin()">view funny</button>
        </div>

        <div id="funny" class="os-window">
            <div class="window-titlebar" id="titlebar">
                <span>fun</span>

                <div class="window-buttons">
                    <button onclick="minWin()">−</button>
                    <button onclick="closeWin()">×</button>
                </div>
            </div>

            <div class="window-content">
                <img src="images/OPSECvpn.jpg" alt="THEY DON'T KNOW NOTHIN' ABOUT ME, MAN. I USE A VPN!" />
            </div>

            <div class="resize"></div>
        </div>

        <div id="taskbar" class="taskbar"></div>

        <script src="script.js"></script>
    </body>
</html>
