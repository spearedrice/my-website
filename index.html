<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rice's Site</title>
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <div id="desktop-icons"></div>

        <div id="main-panel">
            <div class="panel">
                <div class="intro">
                    <h1>Hello!</h1>
                    <p>Welcome to my site!</p>
                </div>
            </div>

            <div class="panel">
                <h2>About Me</h2>
                <p>
                    Hey! I'm Rice. This site is still a work in progress, but
                    I'll be adding more to it over time.
                </p>
            </div>

        </div>

        <div id="windows"></div>

        <div id="music-player">
            <div class="music-titlebar">
                <img class="music-icon" src="images/music.png" alt="" />
                now playing
            </div>
            <div class="music-body">
                <span id="music-track">theme.mp3</span>
                <div class="music-controls">
                    <button id="music-toggle">▶</button>
                    <input id="music-volume" type="range" min="0" max="1" step="0.01" value="0.5" />
                </div>
            </div>
            <audio id="music-audio" src="audio/theme.mp3" loop></audio>
        </div>

        <div id="taskbar" class="taskbar"></div>

        <script src="script.js"></script>
    </body>
</html>
